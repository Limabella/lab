<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="청록 헌장 평가 기록의 순위 변화와 누적 경향을 살펴봅니다." />
    <title>청록 헌장 · 기록 분석</title>
    <link rel="stylesheet" href="assets/styles.css" />
    <script src="assets/charter.js" defer></script>
    <script src="assets/history.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#history-main">기록 분석으로 바로가기</a>
    <header class="site-header">
      <a class="brand" href="index.html"><span class="brand-mark">靑錄</span><span><strong>청록 헌장</strong><small>연구하고, 구현하고, 기록합니다</small></span></a>
      <nav aria-label="주요 메뉴"><a class="nav-link" href="index.html">평가</a><a class="nav-link active" href="history.html" aria-current="page">기록 분석</a></nav>
    </header>
    <main class="page-shell history-page" id="history-main">
      <section class="history-hero">
        <div><p class="eyebrow">RECORD ARCHIVE</p><h1>기준의 변화가<br />글의 방향을 보여줍니다.</h1><p class="hero-copy">순위 자체보다 반복해서 놓치는 기준과 꾸준히 지키는 기준을 살펴보세요.</p></div>
        <div class="summary-grid" id="summary-grid" aria-label="기록 요약"></div>
      </section>
      <section class="analysis-card" aria-labelledby="trend-title">
        <div class="section-head"><div><p class="section-kicker">TREND</p><h2 id="trend-title">기준별 순위 변화</h2></div><p>위쪽일수록 높은 우선순위</p></div>
        <div class="chart-wrap" id="trend-chart"><p class="empty">기록을 불러오는 중입니다.</p></div>
        <div class="chart-legend" id="chart-legend"></div>
      </section>
      <section class="analysis-card" aria-labelledby="matrix-title">
        <div class="section-head"><div><p class="section-kicker">MATRIX</p><h2 id="matrix-title">최근 평가 매트릭스</h2></div><p>최근 8건</p></div>
        <div class="matrix-wrap" id="matrix"></div>
      </section>
      <section class="analysis-card" aria-labelledby="archive-title">
        <div class="section-head"><div><p class="section-kicker">ARCHIVE</p><h2 id="archive-title">전체 기록</h2></div></div>
        <div class="record-list" id="all-records"></div>
      </section>
    </main>
    <footer><span>청록(靑錄)</span><p>기록은 판단을 선명하게 만드는 가장 작은 연구입니다.</p></footer>
  </body>
</html>
