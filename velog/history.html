<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>청록 헌장 — 기록 히스토리</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root {
  --bg: #f5f4f0; --sur: #ffffff; --sur2: #eeebe4;
  --bd: #ddd9d0; --bd2: #bfb9ae;
  --tx: #1c1a17; --tx2: #6b665e; --tx3: #a8a29a;
  --teal: #1D9E75; --teal-bg: #E1F5EE; --teal-dk: #085041;
  --r: 10px; --rs: 6px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--tx); }
header { background: var(--sur); border-bottom: 1px solid var(--bd); padding: 15px 32px; display: flex; align-items: baseline; gap: 14px; }
header h1 { font-family: 'Noto Serif KR', serif; font-size: 19px; font-weight: 600; }
header a { margin-left: auto; font-size: 12px; color: var(--teal); text-decoration: none; border: 1px solid var(--teal); padding: 4px 10px; border-radius: var(--rs); }
header a:hover { background: var(--teal-bg); }
.main { max-width: 860px; margin: 0 auto; padding: 28px 20px 60px; }
.card { background: var(--sur); border: 1px solid var(--bd); border-radius: var(--r); padding: 20px 22px; margin-bottom: 18px; }
.ct { font-size: 13px; font-weight: 500; color: var(--tx2); margin-bottom: 14px; }
.ch { position: relative; width: 100%; height: 300px; }
.hst { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { padding: 5px 8px; text-align: left; color: var(--tx3); font-weight: 400; border-bottom: 1px solid var(--bd); white-space: nowrap; }
td { padding: 5px 8px; border-bottom: 1px solid var(--bd); }
tr:last-child td { border-bottom: none; }
.inm { font-weight: 500; color: var(--tx); min-width: 84px; }
.rc { width: 34px; text-align: center; border-radius: 4px; font-size: 11px; font-weight: 500; padding: 2px 0; }
.rrow { display: flex; align-items: flex-start; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--bd); }
.rrow:last-child { border-bottom: none; }
.rd { min-width: 90px; font-size: 12px; color: var(--tx3); line-height: 1.7; }
.rtt { font-size: 12px; font-weight: 500; color: var(--tx); margin-bottom: 4px; }
.cps { display: flex; flex-wrap: wrap; gap: 3px; }
.cp { padding: 1px 7px; border-radius: 20px; font-size: 10px; }
.cg { background: var(--teal-bg); color: var(--teal-dk); }
.cb { background: #e2dfd7; color: #5f5a52; }
.emp { font-size: 13px; color: var(--tx3); padding: 12px 0; }
</style>
</head>
<body>
<header>
  <h1>청록(靑錄) 기록 히스토리</h1>
  <a href="index.html">← 평가 일지로</a>
</header>
<div class="main" id="main">
  <div class="card"><div class="emp">불러오는 중...</div></div>
</div>

<script>
var ITEMS = [
  {id:'structure',   name:'글 구조'},
  {id:'logic',       name:'논리적 흐름'},
  {id:'ai',          name:'AI 활용'},
  {id:'data',        name:'데이터화'},
  {id:'tone',        name:'감정 톤'},
  {id:'problem',     name:'문제의식'},
  {id:'politics',    name:'정치학'},
  {id:'engineering', name:'공학'},
  {id:'citation',    name:'인용'}
];
var PAL = ['#1D9E75','#378ADD','#D4537E','#BA7517','#534AB7','#D85A30','#639922','#0F6E56','#993556'];

function rankColor(r) {
  if (r <= 2) return { bg:'#E1F5EE', color:'#085041' };
  if (r <= 5) return { bg:'#c8f0e0', color:'#0F6E56' };
  if (r <= 7) return { bg:'#eeebe4', color:'#6b665e' };
  return { bg:'#e2dfd7', color:'#5f5a52' };
}

async function load() {
  var main = document.getElementById('main');
  var recs;
  try {
    var res = await fetch('/api/records');
    recs = await res.json();
  } catch(e) {
    main.innerHTML = '<div class="card"><div class="emp">서버 미연결 — python server.py 실행 확인</div></div>';
    return;
  }
  if (!recs.length) {
    main.innerHTML = '<div class="card"><div class="emp">아직 저장된 기록이 없습니다.</div></div>';
    return;
  }
  main.innerHTML = '';
  var sorted = recs.slice().sort(function(a,b){ return a.date.localeCompare(b.date); });
  var dates  = sorted.map(function(r){ return r.date; });

  /* 추이 차트 */
  var cc = document.createElement('div');
  cc.className = 'card';
  cc.innerHTML = '<div class="ct">항목별 순위 추이 <span style="font-size:11px;color:var(--tx3);font-weight:400">(낮을수록 상위)</span></div><div class="ch"><canvas id="tc" role="img" aria-label="항목별 순위 변화 꺾은선 차트"></canvas></div>';
  main.appendChild(cc);

  var datasets = ITEMS.map(function(item, ii) {
    return {
      label: item.name,
      data: sorted.map(function(r) {
        if (!r.ranking) return null;
        var f = r.ranking.find(function(x){ return x.id === item.id; });
        return f ? f.rank : null;
      }),
      borderColor: PAL[ii],
      backgroundColor: PAL[ii] + '22',
      borderWidth: 1.5,
      pointRadius: 4,
      pointHoverRadius: 6,
      tension: 0.3
    };
  });

  new Chart(document.getElementById('tc'), {
    type: 'line',
    data: { labels: dates, datasets: datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: function(ctx){ return ctx.dataset.label + ': ' + ctx.parsed.y + '위'; } } }
      },
      scales: {
        y: { reverse: true, min: 1, max: 9, ticks: { stepSize: 1, callback: function(v){ return v + '위'; }, color:'#a8a29a', font:{size:11} }, grid: { color:'rgba(0,0,0,0.05)' } },
        x: { ticks: { color:'#a8a29a', font:{size:11}, maxRotation: 40 }, grid: { display: false } }
      }
    }
  });

  /* legend */
  var lg = document.createElement('div');
  lg.style.cssText = 'display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;';
  ITEMS.forEach(function(item, ii) {
    lg.innerHTML += '<span style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--tx2)"><span style="width:14px;height:2px;background:' + PAL[ii] + ';display:inline-block;border-radius:1px"></span>' + item.name + '</span>';
  });
  cc.appendChild(lg);

  /* 히트맵 (3회 이상일 때) */
  if (sorted.length >= 3) {
    var recent = sorted.slice(-8);
    var rdates  = recent.map(function(r){ return r.date.slice(5); });
    var hc = document.createElement('div');
    hc.className = 'card';
    var thead = '<tr><th>항목</th>' + rdates.map(function(d){ return '<th>' + d + '</th>'; }).join('') + '</tr>';
    var tbody = ITEMS.map(function(item) {
      var cells = recent.map(function(r) {
        if (!r.ranking) return '<td></td>';
        var f = r.ranking.find(function(x){ return x.id === item.id; });
        var rank = f ? f.rank : '-';
        var s = typeof rank === 'number' ? rankColor(rank) : { bg:'', color:'var(--tx3)' };
        return '<td><div class="rc" style="background:' + s.bg + ';color:' + s.color + '">' + rank + '</div></td>';
      }).join('');
      return '<tr><td class="inm">' + item.name + '</td>' + cells + '</tr>';
    }).join('');
    hc.innerHTML = '<div class="ct">날짜별 순위 히트맵 <span style="font-size:11px;color:var(--tx3);font-weight:400">(최근 8회)</span></div><div class="hst"><table><thead>' + thead + '</thead><tbody>' + tbody + '</tbody></table></div>';
    main.appendChild(hc);
  }

  /* 목록 */
  var lc = document.createElement('div');
  lc.className = 'card';
  lc.innerHTML = '<div class="ct">최근 기록</div>';
  sorted.slice().reverse().slice(0, 10).forEach(function(r) {
    var ranking = r.ranking || [];
    var gc = '', bc = '';
    ranking.forEach(function(x) {
      if (x.zone === 'good') gc += '<span class="cp cg">' + x.rank + '. ' + x.name + '</span>';
      else                   bc += '<span class="cp cb">' + x.rank + '. ' + x.name + '</span>';
    });
    var row = document.createElement('div');
    row.className = 'rrow';
    row.innerHTML = '<div class="rd">' + r.date + '</div><div>' +
      (r.title ? '<div class="rtt">' + r.title + '</div>' : '') +
      '<div class="cps">' + gc + bc + '</div></div>';
    lc.appendChild(row);
  });
  main.appendChild(lc);
}

load();
</script>
</body>
</html>
